<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vizinho — Conectamos pessoas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#effefb', 100: '#c8fff4', 200: '#97fee9',
              300: '#54f5d7', 400: '#1de4bf', 500: '#06cba7',
              600: '#089f88', 700: '#0d7f6f', 800: '#116459',
              900: '#0d5249', 950: '#00312d',
            },
            destaque: {
              50: '#fff8e1', 100: '#ffecb3', 200: '#ffd54f',
              300: '#ffca28', 400: '#ffc107', 500: '#ffb300',
              600: '#ff8f00', 700: '#e67700',
            },
          },
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            body: ['Figtree', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body { background: #0f172a; font-family: 'Figtree', system-ui, sans-serif; }

    .app-frame {
      animation: frameIn .6s ease-out both;
    }
    @keyframes frameIn {
      from { opacity: 0; transform: translateY(16px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes telaIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    [data-tela]:not(.hidden) {
      animation: telaIn .25s ease-out both;
    }
    [data-tela].hidden { display: none !important; }

    .scroll-area { scrollbar-width: thin; scrollbar-color: rgba(6,203,167,.2) transparent; }
    .scroll-area::-webkit-scrollbar { width: 3px; }
    .scroll-area::-webkit-scrollbar-thumb { background: rgba(6,203,167,.25); border-radius: 3px; }

    *:focus-visible { outline: 2px solid #06cba7; outline-offset: 2px; border-radius: 4px; }

    .ativo { color: #06cba7; }
    .ativo .nav-dot { opacity: 1; transform: scaleX(1); }

    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 2px 10px; border-radius: 9999px; font-size: .7rem;
      font-weight: 600; letter-spacing: .02em; white-space: nowrap;
    }
    .card {
      background: #fff; border-radius: 16px;
      border: 1px solid #e2e8f0; box-shadow: 0 1px 3px rgba(0,0,0,.06);
      transition: box-shadow .2s, transform .15s;
    }
    .card:active { transform: scale(.985); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: .5rem; padding: .75rem 1.5rem; border-radius: 14px;
      font-weight: 600; font-size: .9rem; border: none; cursor: pointer;
      transition: background .18s, transform .1s, box-shadow .18s;
      font-family: inherit;
    }
    .btn:active { transform: scale(.97); }
    .btn-primario { background: #06cba7; color: #fff; box-shadow: 0 2px 8px rgba(6,203,167,.3); }
    .btn-primario:hover { background: #05b897; }
    .btn-secundario { background: #f1f5f9; color: #334155; }
    .btn-secundario:hover { background: #e2e8f0; }
    .btn-outline { background: transparent; border: 1.5px solid #06cba7; color: #06cba7; }
    .btn-outline:hover { background: #effefb; }
    .btn-perigo { background: #ef4444; color: #fff; }
    .btn-perigo:hover { background: #dc2626; }

    .nav-dot {
      width: 4px; height: 4px; border-radius: 50%; background: #06cba7;
      opacity: 0; transform: scaleX(0); transition: all .22s;
    }
    .toast-enter { animation: toastIn .3s ease-out both; }
    .toast-exit { animation: toastOut .28s ease-in both; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }
    @keyframes modalIn { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal-card { animation: modalIn .22s ease-out both; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-6">

  <div class="app-frame w-full max-w-[390px] h-[100dvh] sm:h-[844px] sm:rounded-[44px] bg-slate-50 sm:border-[7px] sm:border-slate-800 sm:shadow-2xl sm:shadow-black/60 overflow-hidden relative flex flex-col">

    <!-- Status bar -->
    <div class="flex items-center justify-between px-7 pt-3 pb-1 bg-white select-none flex-shrink-0">
      <span class="text-xs font-semibold text-slate-900 tracking-tight" id="relogio">09:41</span>
      <div class="flex items-center gap-1.5">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor" class="text-slate-800">
          <rect x="0" y="5" width="3" height="7" rx=".8"/><rect x="4.5" y="4" width="3" height="8" rx=".8"/>
          <rect x="9" y="2.5" width="3" height="9.5" rx=".8"/><rect x="13.5" y="1" width="3" height="11" rx=".8"/>
        </svg>
        <svg width="15" height="12" viewBox="0 0 15 12" fill="currentColor" class="text-slate-800">
          <path d="M7.5 2.5C10.6 2.5 13.5 3.8 13.5 6.5v3.5H1.5V6.5C1.5 3.8 4.4 2.5 7.5 2.5z"/>
          <rect x="5.5" y="9.5" width="4" height="2" rx=".6"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor" class="text-slate-800">
          <rect x="0" y="0" width="22" height="12" rx="3" stroke="currentColor" stroke-width="1" fill="none"/>
          <rect x="23" y="4" width="2" height="4" rx=".5"/>
          <rect x="1.5" y="1.5" width="17" height="9" rx="1.5" fill="#22c55e"/>
        </svg>
      </div>
    </div>

    <!-- App header -->
    <header class="bg-white border-b border-slate-100 px-5 py-3 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-2.5">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
          <rect width="34" height="34" rx="10" fill="#06cba7"/>
          <path d="M17 7.5C12.5 7.5 9 10.2 9 14s3.5 7.5 8 7.5 8-2.7 8-6.5S21.5 7.5 17 7.5zm3.8 4.6h.1c.5 0 .8.3.8.8v.5c0 .5-.4.8-.9.8h-.1c-.5 0-.8-.3-.8-.8v-.5c0-.5.4-.8.9-.8zm-7.5 0h.1c.5 0 .8.3.8.8v.5c0 .5-.4.8-.9.8h-.1c-.5 0-.8-.3-.8-.8v-.5c0-.5.4-.8.9-.8zm3.7 3.3c1.5 0 2.8-.6 3.7-1.6.3-.3.5-.6.5-1 0-.4-.2-.8-.5-1-.3-.3-.7-.4-1.1-.4s-.8.1-1.1.4c-.1.1-.2.2-.3.3l-.8.8c-.2.2-.4.2-.6.1s-.3-.3-.3-.5l.1-.2c.1-.3.2-.6.4-.9.3-.5.8-.9 1.4-1.1.2-.1.4-.1.6-.1s.4 0 .6.1c.5.2.8.6.8 1.1 0 .5-.3 1-.8 1.2-.3.1-.7 0-1-.3l-.9-.9c-.2-.2-.5-.3-.8-.3s-.6.1-.8.3c-.2.2-.3.5-.3.8 0 .5.2.9.6 1.2.7.6 1.6.9 2.7.9z" fill="#fff"/>
        </svg>
        <span class="font-display font-700 text-lg text-slate-900 tracking-tight">Vizinho</span>
      </div>
      <button class="w-9 h-9 rounded-full bg-slate-50 flex items-center justify-center hover:bg-slate-100 transition-colors" onclick="abrirModal('<div class=\'text-center py-4\'><p class=\'text-slate-500 text-sm\'>Você receberá novidades e alertas de novos anúncios diretamente no seu WhatsApp.</p></div>', 'Notificações')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-600">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
        </svg>
        <span class="absolute -mt-5 ml-3 w-2.5 h-2.5 bg-destaque-500 rounded-full border-2 border-white"></span>
      </button>
    </header>

    <!-- Main content -->
    <main id="conteudo-app" class="flex-1 overflow-y-auto scroll-area bg-slate-50 relative">
      <section data-tela="home-vitrine" class="hidden">
      <div class="px-4 pt-4 pb-24 overflow-y-auto h-screen" style="padding-bottom:96px">
        <!-- Header: saudação + busca -->
        <div class="mb-4">
          <p class="text-sm text-gray-500 font-body">Bom dia, Carlos 👋</p>
          <h1 class="text-xl font-display font-bold text-gray-900">Encontre o que precisa</h1>
        </div>

        <!-- Busca -->
        <div class="flex items-center gap-2 mb-4">
          <button onclick="home_vitrine_abrirBusca()" class="flex-1 flex items-center gap-2 bg-gray-100 rounded-xl px-4 py-3 text-left text-gray-400 text-sm active:scale-[0.98] transition-transform">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M21 21l-4.35-4.35"/></svg>
            <span>Buscar produtos, serviços...</span>
          </button>
          <button onclick="mostrarTela('perfil-e-conta')" class="relative p-3 bg-gray-100 rounded-xl active:scale-95 transition-transform">
            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-white text-[10px] font-bold flex items-center justify-center">3</span>
          </button>
        </div>

        <!-- Categorias -->
        <div class="mb-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-base font-display font-semibold text-gray-900">Categorias</h2>
            <button onclick="mostrarTela('home-vitrine')" class="text-xs font-medium" style="color:var(--marca-600)">Ver todas</button>
          </div>
          <div class="flex gap-3 overflow-x-auto pb-2 -mx-4 px-4" style="scrollbar-width:none;-ms-overflow-style:none">
            <button onclick="home_vitrine_filtrarCategoria('Eletrônicos')" class="flex flex-col items-center gap-1.5 flex-shrink-0 active:scale-95 transition-transform">
              <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#EFF6FF"><svg class="w-7 h-7" style="color:var(--marca-600)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M8 21h8M12 17v4"/></svg></div>
              <span class="text-xs text-gray-600 font-medium whitespace-nowrap">Eletrônicos</span>
            </button>
            <button onclick="home_vitrine_filtrarCategoria('Veículos')" class="flex flex-col items-center gap-1.5 flex-shrink-0 active:scale-95 transition-transform">
              <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#FEF3C7"><svg class="w-7 h-7 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 17h.01M16 17h.01M5 17a2 2 0 01-2-2V9a2 2 0 012-2h1l2-3h8l2 3h1a2 2 0 012 2v6a2 2 0 01-2 2M5 17h14"/><circle cx="7.5" cy="17.5" r="1.5" fill="currentColor"/><circle cx="16.5" cy="17.5" r="1.5" fill="currentColor"/></svg></div>
              <span class="text-xs text-gray-600 font-medium whitespace-nowrap">Veículos</span>
            </button>
            <button onclick="home_vitrine_filtrarCategoria('Imóveis')" class="flex flex-col items-center gap-1.5 flex-shrink-0 active:scale-95 transition-transform">
              <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#ECFDF5"><svg class="w-7 h-7 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></div>
              <span class="text-xs text-gray-600 font-medium whitespace-nowrap">Imóveis</span>
            </button>
            <button onclick="home_vitrine_filtrarCategoria('Serviços')" class="flex flex-col items-center gap-1.5 flex-shrink-0 active:scale-95 transition-transform">
              <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#FDF2F8"><svg class="w-7 h-7 text-pink-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3" stroke-width="2"/></svg></div>
              <span class="text-xs text-gray-600 font-medium whitespace-nowrap">Serviços</span>
            </button>
            <button onclick="home_vitrine_filtrarCategoria('Móveis')" class="flex flex-col items-center gap-1.5 flex-shrink-0 active:scale-95 transition-transform">
              <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#FFF7ED"><svg class="w-7 h-7 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg></div>
              <span class="text-xs text-gray-600 font-medium whitespace-nowrap">Móveis</span>
            </button>
            <button onclick="home_vitrine_filtrarCategoria('Moda')" class="flex flex-col items-center gap-1.5 flex-shrink-0 active:scale-95 transition-transform">
              <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#F0FDF4"><svg class="w-7 h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg></div>
              <span class="text-xs text-gray-600 font-medium whitespace-nowrap">Moda</span>
            </button>
            <button onclick="home_vitrine_filtrarCategoria('Esportes')" class="flex flex-col items-center gap-1.5 flex-shrink-0 active:scale-95 transition-transform">
              <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:#F5F3FF"><svg class="w-7 h-7 text-violet-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M12 2a14.5 14.5 0 000 20 14.5 14.5 0 000-20zM2 12h20"/></svg></div>
              <span class="text-xs text-gray-600 font-medium whitespace-nowrap">Esportes</span>
            </button>
          </div>
        </div>

        <!-- Banner promocional -->
        <div onclick="home_vitrine_clicouBanner()" class="rounded-2xl p-5 mb-5 text-white active:scale-[0.98] transition-transform cursor-pointer relative overflow-hidden" style="background:linear-gradient(135deg, var(--marca-600), var(--marca-800))">
          <div class="relative z-10">
            <span class="inline-block px-2.5 py-1 bg-white/20 rounded-full text-xs font-semibold mb-2">Novidade</span>
            <h3 class="font-display font-bold text-lg mb-1">Frete grátis hoje!</h3>
            <p class="text-sm text-white/80 mb-3">Em compras acima de R$ 150</p>
            <span class="inline-flex items-center gap-1 text-sm font-semibold">Aproveitar <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></span>
          </div>
          <div class="absolute -right-4 -bottom-6 opacity-10">
            <svg class="w-32 h-32" fill="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          </div>
        </div>

        <!-- Anúncios em destaque -->
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-display font-semibold text-gray-900">🔥 Anúncios em destaque</h2>
          <button onclick="home_vitrine_verTodos()" class="text-xs font-medium" style="color:var(--marca-600)">Ver todos</button>
        </div>

        <div id="home-vitrine-lista" class="grid grid-cols-2 gap-3">
        </div>

        <!-- Estado vazio (oculto por padrão) -->
        <div id="home-vitrine-vazio" class="hidden text-center py-12">
          <svg class="w-16 h-16 mx-auto text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M21 21l-4.35-4.35"/></svg>
          <p class="text-gray-500 font-body text-sm">Nenhum anúncio encontrado</p>
          <p class="text-gray-400 text-xs mt-1">Tente mudar os filtros da busca</p>
        </div>
      </div>

      <!-- Modal de busca -->
      <div id="home-vitrine-modal-busca" class="hidden fixed inset-0 z-50 bg-black/50 flex items-end justify-center" onclick="if(event.target===this)home_vitrine_fecharBusca()">
        <div class="bg-white rounded-t-3xl w-full max-w-[430px] p-5 pb-8 transform transition-transform" onclick="event.stopPropagation()">
          <div class="w-10 h-1 bg-gray-200 rounded-full mx-auto mb-4"></div>
          <h3 class="font-display font-bold text-lg text-gray-900 mb-4">Buscar</h3>
          <div class="flex items-center gap-2 bg-gray-100 rounded-xl px-4 py-3 mb-4">
            <svg class="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M21 21l-4.35-4.35"/></svg>
            <input id="home-vitrine-input-busca" type="text" placeholder="O que você está procurando?" class="bg-transparent outline-none flex-1 text-sm font-body text-gray-900 placeholder:text-gray-400" oninput="home_vitrine_filtrarLista()">
          </div>

          <!-- Filtros -->
          <div class="mb-4">
            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 block">Faixa de preço</label>
            <div class="flex gap-2 items-center">
              <input id="home-vitrine-preco-min" type="number" placeholder="Min" class="w-full bg-gray-50 rounded-xl px-3 py-2.5 text-sm outline-none border border-gray-200 focus:border-gray-400 transition-colors" oninput="home_vitrine_filtrarLista()">
              <span class="text-gray-400">—</span>
              <input id="home-vitrine-preco-max" type="number" placeholder="Max" class="w-full bg-gray-50 rounded-xl px-3 py-2.5 text-sm outline-none border border-gray-200 focus:border-gray-400 transition-colors" oninput="home_vitrine_filtrarLista()">
            </div>
          </div>

          <div class="mb-4">
            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 block">Distância máxima</label>
            <div class="flex gap-2">
              <button onclick="home_vitrine_setDistancia(this, 5)" class="home-vitrine-dist-btn flex-1 py-2.5 rounded-xl text-sm font-medium border border-gray-200 text-gray-600 bg-white active:scale-95 transition-all">5 km</button>
              <button onclick="home_vitrine_setDistancia(this, 20)" class="home-vitrine-dist-btn flex-1 py-2.5 rounded-xl text-sm font-medium border text-gray-600 bg-white active:scale-95 transition-all">20 km</button>
              <button onclick="home_vitrine_setDistancia(this, 50)" class="home-vitrine-dist-btn flex-1 py-2.5 rounded-xl text-sm font-medium border text-gray-600 bg-white active:scale-95 transition-all">50 km</button>
              <button onclick="home_vitrine_setDistancia(this, 999)" class="home-vitrine-dist-btn flex-1 py-2.5 rounded-xl text-sm font-medium border text-gray-600 bg-white active:scale-95 transition-all">Tudo</button>
            </div>
          </div>

          <button onclick="home_vitrine_aplicarFiltros()" class="w-full py-3.5 rounded-xl text-white font-semibold text-sm active:scale-[0.98] transition-all" style="background:var(--marca-600)">Aplicar filtros</button>
        </div>
      </div>

      <!-- Modal de detalhe do anúncio -->

  <script>
    // ─── Toast ────────────────────────────────────────────────────────
    function toast(mensagem, tipo) {
      var c = document.getElementById('toast-container');
      var icones = { ok: '✓', erro: '✕', info: 'ℹ' };
      var cores = { ok: 'bg-emerald-600', erro: 'bg-red-600', info: 'bg-sky-600' };
      var el = document.createElement('div');
      el.className = 'toast-enter pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl text-white text-sm font-medium shadow-lg ' + (cores[tipo] || cores.info);
      el.innerHTML = '<span class="text-base">' + (icones[tipo] || '') + '</span>' + mensagem;
      c.appendChild(el);
      setTimeout(function () {
        el.classList.remove('toast-enter');
        el.classList.add('toast-exit');
        setTimeout(function () { el.remove(); }, 300);
      }, 3000);
    }

    // ─── Modal ────────────────────────────────────────────────────────
    function abrirModal(html, titulo) {
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-corpo').innerHTML = html;
      var o = document.getElementById('modal-overlay');
      o.classList.remove('hidden');
      o.classList.add('flex');
    }
    function fecharModal() {
      var o = document.getElementById('modal-overlay');
      o.classList.add('hidden');
      o.classList.remove('flex');
    }
    document.getElementById('modal-overlay').addEventListener('click', function (e) {
      if (e.target === this) fecharModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') fecharModal();
    });

    // ─── Formatadores ────────────────────────────────────────────────
    function brl(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function dataBR(iso) {
      if (!iso) return '—';
      var d = new Date(iso + 'T03:00:00');
      return d.toLocaleDateString('pt-BR');
    }

    // ─── Utilitários auxiliares ───────────────────────────────────────
    function avatarIniciais(nome, cor) {
      var p = nome.split(' ');
      var ini = (p[0][0] || '') + (p.length > 1 ? (p[p.length - 1][0] || '') : '');
      return '<div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm flex-shrink-0" style="background:' + (cor || '#06cba7') + '">' + ini.toUpperCase() + '</div>';
    }

    // ─── Ajudantes de UI (para uso nas telas) ─────────────────────────
    function estrelas(n) {
      var s = '';
      for (var i = 1; i <= 5; i++) {
        s += i <= n ? '★' : (i - 0.5 <= n ? '½' : '☆');
      }
      return s;
    }

    // ─── Relógio da barra de status ──────────────────────────────────
    function atualizarRelogio() {
      var d = new Date();
      document.getElementById('relogio').textContent =
        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    atualizarRelogio();
    setInterval(atualizarRelogio, 30000);

    // ─── Roteador ────────────────────────────────────────────────────
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        var ativo = b.dataset.nav === id;
        b.classList.toggle('ativo', ativo);
        b.classList.toggle('text-marca-600', ativo);
        b.classList.toggle('text-slate-400', !ativo);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('home-vitrine');
    });
  </script>
</body>
</html>
